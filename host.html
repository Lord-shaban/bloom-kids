<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المدرّس | بلوم كيدز</title>

  <!-- صفحة خاصة بالمدرّس — مفيش لينك ليها من الموقع -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#332d6e">

  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg">
  <link rel="apple-touch-icon" href="assets/images/logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=11">
  <link rel="stylesheet" href="css/meeting.css?v=8">

  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/livekit-client@2.21.0/dist/livekit-client.umd.min.js">
</head>
<body class="meet-page is-host" data-role="host">

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="بلوم كيدز — الرئيسية">
        <img src="assets/images/logo.jpeg" alt="شعار بلوم كيدز" class="brand-logo">
        <span class="brand-text">
          <strong>Bloom Kids</strong>
          <small>لوحة المدرّس</small>
        </span>
      </a>
      <a href="index.html" class="btn btn-ghost btn-sm">الموقع الرئيسي</a>
    </div>
  </header>

  <main>
    <!-- ===== دخول المدرّس ===== -->
    <section class="meet-gate" id="gate">
      <div class="container">
        <div class="gate-card">
          <span class="eyebrow">👩‍🏫 لوحة المدرّس</span>
          <h1>ابدأ <span class="hl hl-pink">السيشن</span></h1>
          <p class="gate-sub">من هنا بتفتح السيشن وتتحكم فيها بالكامل.</p>

          <form class="gate-form" id="gateForm" novalidate>
            <label class="field">
              <span>اسمك</span>
              <input type="text" id="displayName" placeholder="مثال: أ. سارة" required
                     autocomplete="name" maxlength="40">
            </label>

            <label class="field">
              <span>كود السيشن</span>
              <input type="text" id="roomCode" placeholder="مثال: bloom-1" required
                     dir="ltr" autocomplete="off" maxlength="40">
            </label>

            <label class="field">
              <span>مفتاح المدرّس</span>
              <input type="password" id="hostKey" dir="ltr" autocomplete="current-password"
                     placeholder="المفتاح السري" required>
            </label>

            <p class="field-error" id="gateError" hidden></p>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="joinBtn">
              🚀 ابدأ السيشن
            </button>
          </form>

          <div class="host-share">
            <label class="field share-field">
              <span>لينك الأطفال</span>
              <input type="text" id="shareLink" dir="ltr" readonly>
            </label>
            <button class="btn btn-ghost btn-block" id="copyBtn" type="button">
              📋 انسخ لينك الأطفال
            </button>
            <p class="host-note">
              الأطفال بيفتحوا اللينك ده ويكتبوا اسمهم وبس — مش محتاجين المفتاح.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== الأوضة ===== -->
    <section class="meet-stage" id="stage" hidden>
      <div class="meet-top">
        <span class="meet-room">👩‍🏫 <b id="roomLabel">…</b></span>
        <span class="meet-count" id="peopleCount" hidden></span>
        <span class="meet-status" id="meetStatus" hidden></span>
        <button class="btn btn-ghost btn-sm" id="panelBtn" type="button">🎛️ التحكم</button>
      </div>

      <div class="meet-body">
        <div class="share-stage" id="shareStage" hidden>
          <video id="shareVideo" autoplay playsinline muted></video>
          <span class="share-tag" id="shareTag"></span>
          <button class="share-zoom" id="fsBtn" type="button" aria-pressed="false" title="ملء الشاشة">
            <span id="fsIcon" aria-hidden="true">⛶</span>
            <span class="share-zoom-text" id="fsText">ملء الشاشة</span>
          </button>
        </div>
        <div class="people" id="people"></div>
      </div>

      <div id="audioSink" aria-hidden="true"></div>

      <div class="meet-controls" role="group" aria-label="أزرار السيشن">
        <button class="ctl ctl-mic" id="micBtn" type="button" aria-pressed="false">
          <span class="ctl-icon" id="micIcon">🔇</span>
          <span class="ctl-text" id="micText">افتح الميك</span>
        </button>

        <button class="ctl ctl-share" id="shareBtn" type="button" aria-pressed="false">
          <span class="ctl-icon">🖥️</span>
          <span class="ctl-text" id="shareText">شارك شاشتك</span>
        </button>

        <button class="ctl ctl-muteall" id="muteAllBtn" type="button">
          <span class="ctl-icon">🤫</span>
          <span class="ctl-text">اكتم الكل</span>
        </button>

        <button class="ctl ctl-hands" id="clearHandsBtn" type="button">
          <span class="ctl-icon">🧹</span>
          <span class="ctl-text">نزّل الإيدين</span>
        </button>

        <button class="ctl ctl-leave" id="hangupBtn" type="button">
          <span class="ctl-icon">👋</span>
          <span class="ctl-text">اقفل</span>
        </button>
      </div>
    </section>

    <!-- ===== لوحة التحكم ===== -->
    <aside class="host-panel" id="panel" hidden>
      <div class="panel-head">
        <strong>🎛️ تحكم السيشن</strong>
        <button class="btn-icon" id="panelClose" type="button" title="اقفل">✕</button>
      </div>
      <p class="panel-hint" id="panelHint">…</p>
      <div class="panel-list" id="panelList"></div>
    </aside>

    <!-- ===== لو حصلت مشكلة ===== -->
    <section class="meet-fallback" id="fallback" hidden>
      <div class="container">
        <div class="gate-card">
          <h2>مش قادرين نفتح السيشن 😕</h2>
          <p class="gate-sub" id="fallbackMsg"></p>
          <button class="btn btn-primary btn-lg" id="fallbackBack" type="button">حاول تاني</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/session.js?v=6"></script>
</body>
</html>
