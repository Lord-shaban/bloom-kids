<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="قطة">
  <title>قطة</title>
  <defs>
    <linearGradient id="ct-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc978"/><stop offset="100%" stop-color="#e8933a"/>
