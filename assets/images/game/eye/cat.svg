  <ellipse cx="298" cy="392" rx="62" ry="70" fill="#f2f7dc" stroke="#8f4f12" stroke-width="9"/>
  <ellipse cx="502" cy="392" rx="62" ry="70" fill="#f2f7dc" stroke="#8f4f12" stroke-width="9"/>
  <ellipse cx="298" cy="392" rx="46" ry="56" fill="#7dc242"/>
  <ellipse cx="502" cy="392" rx="46" ry="56" fill="#7dc242"/>
  <ellipse cx="298" cy="392" rx="15" ry="50" fill="#2b2318"/>
  <ellipse cx="502" cy="392" rx="15" ry="50" fill="#2b2318"/>
  <circle cx="278" cy="366" r="14" fill="#ffffff"/>
  <circle cx="482" cy="366" r="14" fill="#ffffff"/>

  <!-- المناخير والبق — نقطة بداية الزوم -->
