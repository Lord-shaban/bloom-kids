    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(30 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(50 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(70 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(90 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(110 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(130 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(150 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(170 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(190 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(210 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(230 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(250 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(270 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(290 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(310 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(330 400 330)"/>
    <ellipse cx="400" cy="160" rx="34" ry="98" transform="rotate(350 400 330)"/>
  </g>

  <!-- اللب -->
  <circle cx="400" cy="330" r="140" fill="#7a4a22"/>
  <circle cx="400" cy="330" r="132" fill="url(#sf-disc)"/>
  <circle cx="400" cy="330" r="124" fill="url(#sf-seeds)"/>
  <circle cx="400" cy="330" r="132" fill="none" stroke="#5c3418" stroke-width="10"/>
  <ellipse cx="352" cy="280" rx="62" ry="40" fill="#ffffff" opacity="0.10" transform="rotate(-30 352 280)"/>
</svg>
