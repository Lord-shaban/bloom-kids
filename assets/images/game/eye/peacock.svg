<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="طاووس">
  <title>طاووس</title>
  <defs>
    <linearGradient id="pc-fan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fc9b0"/><stop offset="100%" stop-color="#1a7fa8"/>
    </linearGradient>
    <linearGradient id="pc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e6fd6"/><stop offset="100%" stop-color="#123f8c"/>
    </linearGradient>
    <!-- عين الريشة: النقش ده هو أهم تفصيلة في الصورة -->
    <g id="pc-eye">
      <ellipse cx="0" cy="0" rx="46" ry="56" fill="#2fae9c"/>
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="#1f5fb0"/>
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#f0b429"/>
      <ellipse cx="0" cy="0" rx="11" ry="15" fill="#3a1d6e"/>
    </g>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <!-- المروحة -->
  <path d="M400 620 C 120 620 60 380 152 232 C 236 96 564 96 648 232
           C 740 380 680 620 400 620 Z" fill="url(#pc-fan)"
        stroke="#0f5f7d" stroke-width="12"/>
  <!-- سيقان الريش -->
  <g stroke="#0f5f7d" stroke-width="7" opacity="0.55" fill="none">
    <path d="M400 600 L 150 300 M400 600 L 240 200 M400 600 L 330 150
             M400 600 L 470 150 M400 600 L 560 200 M400 600 L 650 300
             M400 600 L 400 140 M400 600 L 110 430 M400 600 L 690 430"/>
  </g>

  <!-- عيون الريش -->
  <use href="#pc-eye" x="0" y="0" transform="translate(400 196)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(292 214)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(508 214)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(200 288)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(600 288)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(140 400)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(660 400)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(276 372)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(524 372)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(400 340)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(196 500)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(604 500)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(320 500)"/>
  <use href="#pc-eye" x="0" y="0" transform="translate(480 500)"/>

  <!-- الجسم -->
  <ellipse cx="400" cy="640" rx="104" ry="128" fill="url(#pc-body)"
           stroke="#0d2f68" stroke-width="12"/>
  <!-- الرقبة والراس -->
  <path d="M400 560 C 386 500 386 452 400 420" stroke="#123f8c" stroke-width="62"
        stroke-linecap="round" fill="none"/>
  <circle cx="402" cy="404" r="56" fill="#1f5fb0" stroke="#0d2f68" stroke-width="10"/>
  <circle cx="380" cy="392" r="12" fill="#ffffff"/>
  <circle cx="378" cy="394" r="6" fill="#0d2f68"/>
  <circle cx="424" cy="392" r="12" fill="#ffffff"/>
  <circle cx="426" cy="394" r="6" fill="#0d2f68"/>
  <path d="M402 418 l-42 16 l42 16 Z" fill="#f0b429"/>
  <!-- تاج الراس -->
  <g stroke="#0d2f68" stroke-width="7" fill="none">
    <path d="M382 356 L 366 316"/><path d="M402 350 L 402 306"/><path d="M422 356 L 438 316"/>
  </g>
  <circle cx="366" cy="308" r="12" fill="#2fae9c"/>
  <circle cx="402" cy="298" r="12" fill="#2fae9c"/>
  <circle cx="438" cy="308" r="12" fill="#2fae9c"/>
</svg>
