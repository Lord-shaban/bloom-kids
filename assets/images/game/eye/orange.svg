  <!-- النقرة العليا والورقة -->
  <circle cx="400" cy="212" r="26" fill="#8a5a1a"/>
  <path d="M416 196 C 476 128 578 126 626 156 C 600 248 502 274 424 230 Z"
        fill="url(#or-leaf)" stroke="#2f6f22" stroke-width="10" stroke-linejoin="round"/>
  <path d="M440 212 C 500 182 562 170 610 162" fill="none" stroke="#2f6f22"
        stroke-width="7" stroke-linecap="round" opacity="0.8"/>
