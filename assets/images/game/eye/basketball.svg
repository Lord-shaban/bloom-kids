    <path d="M400 92 L 400 708"/>
    <path d="M96 400 L 704 400"/>
    <path d="M160 148 C 300 300 300 500 160 652"/>
    <path d="M640 148 C 500 300 500 500 640 652"/>
  </g>

  <!-- لمعة -->
  <ellipse cx="292" cy="264" rx="94" ry="60" fill="#ffffff" opacity="0.22"
           transform="rotate(-30 292 264)"/>
  <circle cx="400" cy="400" r="304" fill="none" stroke="#8c3c04" stroke-width="13"/>
