    <circle cx="240" cy="220" r="7"/><circle cx="300" cy="190" r="6"/>
    <circle cx="360" cy="230" r="7"/><circle cx="430" cy="196" r="6"/>
    <circle cx="500" cy="236" r="7"/><circle cx="560" cy="200" r="6"/>
    <circle cx="200" cy="300" r="6"/><circle cx="270" cy="330" r="7"/>
    <circle cx="340" cy="296" r="6"/><circle cx="410" cy="336" r="7"/>
    <circle cx="480" cy="300" r="6"/><circle cx="550" cy="340" r="7"/>
    <circle cx="610" cy="300" r="6"/><circle cx="180" cy="420" r="7"/>
    <circle cx="250" cy="450" r="6"/><circle cx="320" cy="410" r="7"/>
    <circle cx="390" cy="450" r="6"/><circle cx="460" cy="416" r="7"/>
    <circle cx="530" cy="452" r="6"/><circle cx="600" cy="420" r="7"/>
    <circle cx="220" cy="540" r="6"/><circle cx="290" cy="570" r="7"/>
    <circle cx="360" cy="530" r="6"/><circle cx="430" cy="570" r="7"/>
