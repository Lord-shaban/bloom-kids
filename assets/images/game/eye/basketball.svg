      <stop offset="100%" stop-color="#a84a06"/>
    </radialGradient>
    <clipPath id="bb-clip"><circle cx="400" cy="400" r="304"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <circle cx="400" cy="400" r="304" fill="url(#bb-body)" stroke="#8c3c04" stroke-width="13"/>

