<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="كورة سلة">
  <title>كورة سلة</title>
  <defs>
    <radialGradient id="bb-body" cx="0.34" cy="0.28" r="0.85">
