    <circle cx="530" cy="474" r="8"/><circle cx="300" cy="524" r="10"/>
    <circle cx="368" cy="516" r="8"/><circle cx="436" cy="516" r="10"/>
    <circle cx="502" cy="524" r="8"/><circle cx="340" cy="574" r="8"/>
    <circle cx="400" cy="568" r="10"/><circle cx="462" cy="574" r="8"/>
