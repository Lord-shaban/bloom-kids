  <!-- حبيبات الترس — تفاصيل تستحمّل الزوم العالي -->
  <g clip-path="url(#cb-clip)" fill="#b52418" opacity="0.55">
    <circle cx="300" cy="420" r="10"/><circle cx="360" cy="404" r="8"/>
    <circle cx="420" cy="404" r="10"/><circle cx="480" cy="420" r="8"/>
    <circle cx="270" cy="474" r="8"/><circle cx="330" cy="464" r="10"/>
