    <path d="M588 542 C 654 584 684 634 692 690"/>
    <path d="M560 592 C 610 646 628 700 628 748"/>
  </g>

  <!-- الزنانير (الكماشة) — نقطة بداية الزوم -->
  <g stroke="#8c1810" stroke-width="10" stroke-linejoin="round">
