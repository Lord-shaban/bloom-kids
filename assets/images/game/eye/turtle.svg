    <path d="M544 330 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M256 330 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M472 204 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M328 204 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M616 204 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M184 204 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M472 456 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M328 456 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M616 456 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M184 456 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M400 582 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M544 582 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
    <path d="M256 582 l72 42 l0 84 l-72 42 l-72 -42 l0 -84 Z"/>
