      <stop offset="100%" stop-color="#2c6318"/>
    </radialGradient>
    <clipPath id="tu-clip"><ellipse cx="400" cy="424" rx="266" ry="212"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <!-- الرجلين -->
  <g fill="#7fc44a" stroke="#2c6318" stroke-width="10">
    <ellipse cx="192" cy="560" rx="76" ry="52" transform="rotate(26 192 560)"/>
    <ellipse cx="608" cy="560" rx="76" ry="52" transform="rotate(-26 608 560)"/>
    <ellipse cx="236" cy="286" rx="66" ry="46" transform="rotate(-28 236 286)"/>
    <ellipse cx="564" cy="286" rx="66" ry="46" transform="rotate(28 564 286)"/>
  </g>
  <!-- الديل -->
  <path d="M400 634 L 372 700 L 400 686 L 428 700 Z" fill="#7fc44a"
