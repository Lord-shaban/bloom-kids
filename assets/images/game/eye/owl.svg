  <!-- العنين -->
  <circle cx="308" cy="330" r="106" fill="#f7ecd8" stroke="#4f3418" stroke-width="11"/>
  <circle cx="492" cy="330" r="106" fill="#f7ecd8" stroke="#4f3418" stroke-width="11"/>
  <circle cx="308" cy="330" r="62" fill="#f0a81c"/>
  <circle cx="492" cy="330" r="62" fill="#f0a81c"/>
  <circle cx="308" cy="330" r="36" fill="#2b2318"/>
  <circle cx="492" cy="330" r="36" fill="#2b2318"/>
  <circle cx="292" cy="312" r="14" fill="#ffffff"/>
  <circle cx="476" cy="312" r="14" fill="#ffffff"/>

  <!-- المنقار -->
  <path d="M400 348 L 446 400 L 400 462 L 354 400 Z" fill="#e09a2a"
        stroke="#a86a10" stroke-width="8" stroke-linejoin="round"/>
