<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="زرافة">
  <title>زرافة</title>
  <defs>
    <linearGradient id="gf-skin" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#f7d79b"/>
      <stop offset="55%" stop-color="#efc178"/>
      <stop offset="100%" stop-color="#dda85c"/>
    </linearGradient>
    <!-- الرقبة + الراس مع بعض، بنقصّ عليهم البقع عشان متخرجش برّه -->
    <clipPath id="gf-body">
      <path d="M262 800 C 262 626 284 466 318 350 L 486 350 C 512 466 530 626 530 800 Z"/>
      <ellipse cx="382" cy="248" rx="152" ry="104" transform="rotate(-13 382 248)"/>
    </clipPath>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <!-- القرون -->
  <g>
    <path d="M356 158 L340 74" stroke="#c78f4e" stroke-width="20" stroke-linecap="round"/>
    <circle cx="338" cy="66" r="21" fill="#5c4326"/>
    <path d="M462 172 L470 88" stroke="#c78f4e" stroke-width="20" stroke-linecap="round"/>
    <circle cx="472" cy="80" r="21" fill="#5c4326"/>
  </g>

  <!-- الودن -->
  <path d="M498 208 C 566 172 646 178 668 204 C 646 254 566 274 502 252 Z" fill="#dda85c"/>
  <path d="M512 216 C 566 190 620 194 636 210 C 620 240 570 252 518 238 Z" fill="#f6c9a0"/>

  <!-- الرقبة -->
  <path d="M262 800 C 262 626 284 466 318 350 L 486 350 C 512 466 530 626 530 800 Z"
        fill="url(#gf-skin)"/>

  <!-- الراس -->
  <ellipse cx="382" cy="248" rx="152" ry="104" transform="rotate(-13 382 248)" fill="url(#gf-skin)"/>
  <!-- البوز -->
  <ellipse cx="236" cy="298" rx="86" ry="70" transform="rotate(-13 236 298)" fill="#f9dfb4"/>

  <!-- البقع — دي التفصيلة اللي اللعبة بتبدأ عندها -->
  <g clip-path="url(#gf-body)" fill="#b5651d">
    <path d="M296 396 l70 -18 l40 40 l-26 56 l-70 6 l-24 -48 Z"/>
    <path d="M420 380 l72 -6 l24 48 l-34 50 l-64 -8 l-22 -46 Z"/>
    <path d="M280 528 l68 -14 l36 40 l-22 56 l-70 4 l-26 -46 Z"/>
    <path d="M406 512 l76 -8 l26 50 l-32 52 l-68 -8 l-20 -48 Z"/>
    <path d="M270 664 l70 -12 l32 42 l-24 56 l-70 2 l-24 -46 Z"/>
    <path d="M400 648 l78 -6 l22 48 l-30 54 l-70 -8 l-18 -48 Z"/>
    <path d="M330 232 l62 -20 l34 34 l-22 48 l-62 4 l-22 -42 Z"/>
    <path d="M446 208 l64 -6 l20 40 l-28 44 l-58 -8 l-18 -38 Z"/>
    <path d="M300 132 l54 -14 l26 30 l-18 40 l-54 4 l-18 -34 Z"/>
  </g>

  <!-- عرف الرقبة -->
  <g clip-path="url(#gf-body)">
    <path d="M486 350 C 512 466 530 626 530 800 L 578 800 C 578 620 558 456 530 344 Z"
          fill="#8d5a2b" opacity="0.8"/>
  </g>

  <!-- العين -->
  <ellipse cx="392" cy="224" rx="27" ry="31" fill="#ffffff"/>
  <circle cx="394" cy="228" r="17" fill="#3a2a17"/>
  <circle cx="400" cy="220" r="6.5" fill="#ffffff"/>
  <path d="M360 186 C 378 172 406 172 424 184" stroke="#8d5a2b" stroke-width="8"
        stroke-linecap="round" fill="none"/>

  <!-- المنخار والبق -->
  <ellipse cx="198" cy="272" rx="14" ry="19" fill="#8d5a2b" transform="rotate(-13 198 272)"/>
  <path d="M180 330 C 210 348 250 348 278 332" stroke="#8d5a2b" stroke-width="9"
        stroke-linecap="round" fill="none"/>
</svg>
