<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="بيتزا">
  <title>بيتزا</title>
  <defs>
    <radialGradient id="pz-cheese" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffd97a"/>
