      <circle cx="272" cy="252" r="7"/><circle cx="302" cy="280" r="6"/><circle cx="278" cy="288" r="5"/>
      <circle cx="460" cy="218" r="6"/><circle cx="484" cy="242" r="5.5"/>
      <circle cx="566" cy="364" r="7"/><circle cx="590" cy="392" r="5.5"/>
      <circle cx="242" cy="440" r="6.5"/><circle cx="264" cy="466" r="5"/>
      <circle cx="418" cy="456" r="7"/><circle cx="446" cy="484" r="6"/><circle cx="424" cy="490" r="5"/>
      <circle cx="322" cy="616" r="6"/><circle cx="342" cy="640" r="5"/>
      <circle cx="536" cy="586" r="6"/><circle cx="558" cy="608" r="5"/>
    </g>

    <!-- زيتون -->
    <g>
      <circle cx="368" cy="340" r="24" fill="#3e4a2b"/><circle cx="368" cy="340" r="9" fill="#f6b93b"/>
      <circle cx="520" cy="470" r="22" fill="#3e4a2b"/><circle cx="520" cy="470" r="8" fill="#f6b93b"/>
      <circle cx="196" cy="352" r="21" fill="#3e4a2b"/><circle cx="196" cy="352" r="8" fill="#f6b93b"/>
      <circle cx="430" cy="596" r="22" fill="#3e4a2b"/><circle cx="430" cy="596" r="8" fill="#f6b93b"/>
