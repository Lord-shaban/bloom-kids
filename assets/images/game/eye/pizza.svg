    <g>
      <circle cx="286" cy="266" r="56" fill="#c0392b"/>
      <circle cx="286" cy="266" r="48" fill="#e05244"/>
      <circle cx="470" cy="230" r="50" fill="#c0392b"/>
      <circle cx="470" cy="230" r="43" fill="#e05244"/>
      <circle cx="576" cy="378" r="54" fill="#c0392b"/>
      <circle cx="576" cy="378" r="46" fill="#e05244"/>
      <circle cx="252" cy="452" r="52" fill="#c0392b"/>
      <circle cx="252" cy="452" r="44" fill="#e05244"/>
      <circle cx="430" cy="470" r="58" fill="#c0392b"/>
