      <stop offset="100%" stop-color="#e79a1f"/>
    </radialGradient>
    <radialGradient id="pz-crust" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#e8b473"/>
      <stop offset="100%" stop-color="#c8873f"/>
    </radialGradient>
    <clipPath id="pz-in"><circle cx="400" cy="400" r="286"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <!-- الحافة -->
  <circle cx="400" cy="400" r="330" fill="url(#pz-crust)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#a86a2c" stroke-width="8"/>
  <!-- فقاعات على الحافة -->
  <g fill="#a86a2c" opacity="0.35">
    <ellipse cx="400" cy="92" rx="26" ry="14"/>
    <ellipse cx="613" cy="187" rx="24" ry="13" transform="rotate(60 613 187)"/>
    <ellipse cx="613" cy="613" rx="24" ry="13" transform="rotate(-60 613 613)"/>
    <ellipse cx="400" cy="708" rx="26" ry="14"/>
    <ellipse cx="187" cy="613" rx="24" ry="13" transform="rotate(60 187 613)"/>
    <ellipse cx="187" cy="187" rx="24" ry="13" transform="rotate(-60 187 187)"/>
