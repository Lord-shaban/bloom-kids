  <g fill="#241f2e">
    <ellipse cx="503" cy="438" rx="12" ry="19" transform="rotate(-70 503 438)"/>
    <ellipse cx="419" cy="508" rx="12" ry="19" transform="rotate(-10 419 508)"/>
    <ellipse cx="316" cy="471" rx="12" ry="19" transform="rotate(50 316 471)"/>
    <ellipse cx="297" cy="362" rx="12" ry="19" transform="rotate(110 297 362)"/>
    <ellipse cx="381" cy="292" rx="12" ry="19" transform="rotate(170 381 292)"/>
    <ellipse cx="484" cy="329" rx="12" ry="19" transform="rotate(230 484 329)"/>

    <ellipse cx="525" cy="549" rx="13" ry="21" transform="rotate(-40 525 549)"/>
    <ellipse cx="333" cy="583" rx="13" ry="21" transform="rotate(20 333 583)"/>
    <ellipse cx="208" cy="434" rx="13" ry="21" transform="rotate(80 208 434)"/>
    <ellipse cx="275" cy="251" rx="13" ry="21" transform="rotate(140 275 251)"/>
    <ellipse cx="467" cy="217" rx="13" ry="21" transform="rotate(200 467 217)"/>
    <ellipse cx="592" cy="366" rx="13" ry="21" transform="rotate(260 592 366)"/>

    <ellipse cx="640" cy="422" rx="13" ry="22" transform="rotate(-85 640 422)"/>
    <ellipse cx="506" cy="620" rx="13" ry="22" transform="rotate(-25 506 620)"/>
    <ellipse cx="257" cy="599" rx="13" ry="22" transform="rotate(35 257 599)"/>
    <ellipse cx="160" cy="378" rx="13" ry="22" transform="rotate(95 160 378)"/>
    <ellipse cx="294" cy="180" rx="13" ry="22" transform="rotate(155 294 180)"/>
    <ellipse cx="543" cy="200" rx="13" ry="22" transform="rotate(215 543 200)"/>
  </g>
  <!-- لمعة صغيرة على كل بذرة -->
  <g fill="#5c5470" opacity="0.75">
    <ellipse cx="500" cy="433" rx="4" ry="7" transform="rotate(-70 500 433)"/>
    <ellipse cx="416" cy="503" rx="4" ry="7" transform="rotate(-10 416 503)"/>
    <ellipse cx="313" cy="466" rx="4" ry="7" transform="rotate(50 313 466)"/>
    <ellipse cx="294" cy="357" rx="4" ry="7" transform="rotate(110 294 357)"/>
    <ellipse cx="378" cy="287" rx="4" ry="7" transform="rotate(170 378 287)"/>
    <ellipse cx="481" cy="324" rx="4" ry="7" transform="rotate(230 481 324)"/>
    <ellipse cx="522" cy="543" rx="4" ry="8" transform="rotate(-40 522 543)"/>
    <ellipse cx="330" cy="577" rx="4" ry="8" transform="rotate(20 330 577)"/>
    <ellipse cx="205" cy="428" rx="4" ry="8" transform="rotate(80 205 428)"/>
    <ellipse cx="272" cy="245" rx="4" ry="8" transform="rotate(140 272 245)"/>
    <ellipse cx="464" cy="211" rx="4" ry="8" transform="rotate(200 464 211)"/>
    <ellipse cx="589" cy="360" rx="4" ry="8" transform="rotate(260 589 360)"/>
