<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="شريحة بطيخ">
  <title>بطيخة</title>
  <defs>
    <radialGradient id="wm-flesh" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#ff7285"/>
      <stop offset="55%" stop-color="#ee4159"/>
      <stop offset="100%" stop-color="#cf2740"/>
    </radialGradient>
    <radialGradient id="wm-rind" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a9e45"/>
      <stop offset="100%" stop-color="#256b2c"/>
    </radialGradient>
    <clipPath id="wm-clip"><circle cx="400" cy="400" r="330"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="#fdf6ec"/>

  <!-- القشرة الخارجية بخطوطها -->
  <circle cx="400" cy="400" r="330" fill="url(#wm-rind)"/>
  <g clip-path="url(#wm-clip)" fill="#1d5824" opacity="0.55">
    <ellipse cx="400" cy="400" rx="20" ry="340" transform="rotate(12 400 400)"/>
    <ellipse cx="400" cy="400" rx="17" ry="340" transform="rotate(48 400 400)"/>
    <ellipse cx="400" cy="400" rx="21" ry="340" transform="rotate(84 400 400)"/>
    <ellipse cx="400" cy="400" rx="16" ry="340" transform="rotate(120 400 400)"/>
    <ellipse cx="400" cy="400" rx="20" ry="340" transform="rotate(156 400 400)"/>
  </g>

  <!-- القشرة البيضا -->
  <circle cx="400" cy="400" r="304" fill="#f4f8e6"/>
  <circle cx="400" cy="400" r="290" fill="#dfeec4"/>

  <!-- اللب الأحمر -->
  <circle cx="400" cy="400" r="283" fill="url(#wm-flesh)"/>

  <!-- عروق فاتحة جوه اللب -->
  <g stroke="#ff8f9d" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M400 400 C 470 350 540 330 610 300"/>
    <path d="M400 400 C 360 480 300 540 250 600"/>
    <path d="M400 400 C 320 380 240 370 170 350"/>
    <path d="M400 400 C 470 470 520 540 560 590"/>
  </g>

