  <g stroke="#ef5f7c" stroke-width="20" stroke-linecap="round" opacity="0.8">
    <path d="M322 486 l104 -60"/><path d="M322 566 l104 -60"/><path d="M370 618 l104 -60"/>
  </g>
  <!-- الحامل -->
  <path d="M244 656 h312 l-46 62 h-220 Z" fill="#d7a24a" stroke="#a97a2c" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="400" cy="726" rx="150" ry="26" fill="#e0ad55" stroke="#a97a2c" stroke-width="10"/>
