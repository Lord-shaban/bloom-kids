  <path d="M400 330 v-38" stroke="#5c4326" stroke-width="11" stroke-linecap="round"/>
  <!-- جسم الشمعة -->
  <rect x="298" y="326" width="204" height="330" rx="24" fill="url(#cd)" stroke="#c99a6a" stroke-width="11"/>
  <!-- الشمع السايح -->
  <path d="M298 356 h204 v46 c-26 0 -26 40 -52 40 s-26 -40 -50 -40 -26 40 -52 40 -24 -40 -50 -40 Z"
