<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="طيارة">
  <title>طيارة</title>
  <defs>
    <linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dfe4ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#fdf6ec"/>
  <!-- سحاب -->
  <g fill="#e6eef6">
    <ellipse cx="150" cy="176" rx="86" ry="44"/><ellipse cx="212" cy="158" rx="60" ry="38"/>
    <ellipse cx="660" cy="642" rx="82" ry="42"/><ellipse cx="602" cy="626" rx="56" ry="34"/>
  </g>
  <!-- الجناح البعيد -->
  <path d="M392 350 L 268 168 L 348 168 L 508 344 Z" fill="#b9c2d4" stroke="#8d97ad" stroke-width="9" stroke-linejoin="round"/>
  <!-- الديل -->
  <path d="M118 402 L 40 262 L 106 262 L 216 386 Z" fill="#23a89f" stroke="#1b8a82" stroke-width="9" stroke-linejoin="round"/>
  <path d="M118 434 L 44 540 L 108 540 L 214 452 Z" fill="#1b8a82" stroke="#166f68" stroke-width="9" stroke-linejoin="round"/>
  <!-- الجسم -->
  <path d="M96 418 C 96 372 148 344 236 336 l332 -26 c108 -8 172 26 172 108
           c0 82 -64 116 -172 108 l-332 -26 C 148 492 96 464 96 418 Z"
        fill="url(#pl)" stroke="#8d97ad" stroke-width="11" stroke-linejoin="round"/>
  <!-- الشبابيك -->
  <g fill="#7fd4f5" stroke="#4a9ec4" stroke-width="5">
    <circle cx="300" cy="404" r="20"/><circle cx="374" cy="400" r="20"/>
    <circle cx="448" cy="398" r="20"/><circle cx="522" cy="396" r="20"/>
  </g>
  <!-- شباك الطيار -->
  <path d="M660 348 c40 6 58 30 58 44 h-84 Z" fill="#7fd4f5" stroke="#4a9ec4" stroke-width="7" stroke-linejoin="round"/>
  <!-- الجناح القريب -->
  <path d="M356 452 L 236 668 L 330 668 L 512 458 Z" fill="#ef5f7c" stroke="#c93f5c" stroke-width="10" stroke-linejoin="round"/>
  <!-- الخط الجانبي -->
  <path d="M180 452 h430" stroke="#ef5f7c" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
</svg>
