<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="قلم">
  <title>قلم</title>
  <rect width="800" height="800" fill="#fdf6ec"/>
  <g transform="rotate(-32 400 400)">
    <!-- جسم القلم -->
    <rect x="330" y="140" width="140" height="400" fill="#f6c60c"
          stroke="#a8760a" stroke-width="11"/>
    <path d="M330 140 h46 v400 h-46 Z" fill="#ffe066"/>
    <path d="M424 140 h46 v400 h-46 Z" fill="#d99a08"/>
    <!-- السن الخشب -->
    <path d="M330 540 L 470 540 L 400 690 Z" fill="#f0c179"
          stroke="#a8760a" stroke-width="11" stroke-linejoin="round"/>
    <!-- الرصاص -->
    <path d="M370 626 L 430 626 L 400 690 Z" fill="#3a3a3a"/>
    <!-- الأستيكة -->
    <rect x="330" y="96" width="140" height="52" rx="14" fill="#ef5f7c"
          stroke="#a8172c" stroke-width="11"/>
    <rect x="330" y="140" width="140" height="26" fill="#b8b8c0"
          stroke="#7a7a86" stroke-width="8"/>
  </g>
</svg>
